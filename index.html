<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Malla Didáctica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Pedagogía en Matemática</h1>
            <p class="subtitle">Malla Didáctica - Plan 2026</p>
        </header>

        <div class="controls">
            <button id="resetBtn" class="reset-btn">↻ Reiniciar Progreso</button>
            <div class="progress-info">
                <span id="completedCount">0</span> / <span id="totalCount">0</span> ramos completados
            </div>
        </div>

        <div class="malla-container">
            <div id="mallaGrid" class="malla-grid">
                <!-- Los ramos se cargarán aquí con JavaScript -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
